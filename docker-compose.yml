# The test rig (make test, valgrind, gdb, benchmark): db is Postgres with the pagila sample db,
# pgwire the cftcl image the tests run in.  Both build for the host's arch (arm64 or x86_64); to
# run another, set DOCKER_DEFAULT_PLATFORM (linux/amd64, linux/arm64).  PG_VERSION picks
# Postgres's major version (default 18).
services:
    db:
        # Tagged by version, so a run with another PG_VERSION builds its own rather than reusing this
        image: pgwire-db:pg${PG_VERSION:-18}
        build:
            context: sampledb
            args:
                PG_VERSION: ${PG_VERSION:-18}
        volumes:
            - run:/run
            - data:/data
        environment:
            POSTGRES_PASSWORD: insecure
            PGDATA: /data
            PGHOST: /run/postgresql
        ports:
            - "5432"
        # Failures in start_period don't count: under emulation (another arch) Postgres takes
        # seconds to start, and start_interval keeps a native start's wait as short as before
        healthcheck:
            test: ["CMD", "psql", "-U", "postgres", "-d", "pagila", "-c", "select count(*) from actor"]
            interval: 1s
            timeout: 1s
            retries: 1
            start_period: 30s
            start_interval: 1s
        security_opt:
          - seccomp:unconfined
        cap_add:
            - NET_ADMIN
            - CAP_SYS_NICE
    pgwire:
        build: pgwire
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - ./src:/src
            - run:/run
            - ./tmp:/tmp/out
            - ~/.aws:/root/.aws
        environment:
            POSTGRES_PASSWORD: insecure
            #PGHOST: /run/postgresql
            PGHOST: db
        security_opt:
          - seccomp:unconfined
        cap_add:
            - NET_ADMIN
            - CAP_SYS_NICE
        # Keep /tmp off the host fs: jitc's scratch dirs can't be removed on NFS
        # (ENOTEMPTY).  Docker mounts tmpfs noexec by default, but jitc loads the
        # objects it compiles from there
        tmpfs:
            - /tmp:exec,mode=1777
        working_dir: /src
        entrypoint: ["make"]
volumes:
    # A data directory is only readable by its Postgres major version: one volume for each
    data:
        name: pgwire_data_pg${PG_VERSION:-18}
    run:
